# Regenerates crates/dagger-sdk/src/gen/ and codegen/generated.json from the
# checked target and schema. `dagger-bootstrap` ships two binaries, so the
# binary must be named explicitly.
[tasks.codegen]
command = "cargo"
args = [
  "run",
  "-q",
  "-p",
  "dagger-bootstrap",
  "--bin",
  "dagger-rust",
  "--",
  "generate",
  "--workspace",
  ".",
  "--update",
]
workspace = false

[tasks.fmt]
command = "cargo"
args = ["fmt", "--all"]
workspace = false

[tasks.fix]
command = "cargo"
args = ["fix", "--workspace", "--allow-dirty"]
dependencies = ["fmt"]
workspace = false

[tasks.gen]
dependencies = ["codegen", "fmt", "fix"]
workspace = false
